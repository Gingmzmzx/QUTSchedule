plugins {
    alias(libs.plugins.android.application)
}

// versionCode = 年份后两位 + 月 + 日 + 当日构建序号，例如 26091701。
// 序号记在根目录 version.properties，每次打包自增，跨天自动从 01 重来。
def versionStampFile = rootProject.layout.projectDirectory.file('version.properties')
def versionStampText = providers.fileContents(versionStampFile).asText.orElse('count=0')

def nextStamp = {
    def today = new java.text.SimpleDateFormat('yyMMdd', Locale.ROOT).format(new Date())
    def props = new Properties()
    props.load(new StringReader(versionStampText.get()))
    def storedDate = props.getProperty('date', '')
    def storedCount = props.getProperty('count', '0')?.toInteger() ?: 0
    return [date: today, build: (today == storedDate) ? storedCount + 1 : 1]
}

def stamp = nextStamp()
def computedVersionCode = stamp.date.toInteger() * 100 + stamp.build

// Release 签名从 local.properties 读，密钥不进版本库。
// 没配置时 release 仍是 unsigned，不阻塞本地调试构建。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseStoreFile = localProps.getProperty('release.storeFile')
def releaseStorePassword = localProps.getProperty('release.storePassword')
def releaseKeyAlias = localProps.getProperty('release.keyAlias')
def releaseKeyPassword = localProps.getProperty('release.keyPassword')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword
        && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.netessx.qutschedule'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.netessx.qutschedule"
        // java.time 与通知渠道都需要 API 26，直接以此为下限省掉一层兼容分支
        minSdk 26
        targetSdk 36
        versionCode computedVersionCode
        versionName "v1.6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                // 允许相对项目根目录或绝对路径
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

/** 打包结束后把当天的构建序号 +1 写回，供下一次打包使用。 */
def stampFile = versionStampFile.asFile
def stampVersion = tasks.register('stampVersion') {
    // 配置缓存下不能在 doLast 里碰 rootProject，文件句柄在这里就捕获好
    def file = stampFile
    doLast {
        def props = new Properties()
        if (file.exists()) {
            file.withInputStream { props.load(it) }
        }
        def today = new java.text.SimpleDateFormat('yyMMdd', Locale.ROOT).format(new Date())
        def storedDate = props.getProperty('date', '')
        def storedCount = props.getProperty('count', '0')?.toInteger() ?: 0
        props.setProperty('date', today)
        props.setProperty('count', ((today == storedDate) ? storedCount + 1 : 1).toString())
        file.withWriter { props.store(it, 'auto-generated by app/build.gradle') }
    }
}

tasks.configureEach { task ->
    if (task.name == 'assembleDebug' || task.name == 'assembleRelease') {
        task.finalizedBy(stampVersion)
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.gson
    implementation libs.swiperefreshlayout
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}