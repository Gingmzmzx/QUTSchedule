plugins {
    alias(libs.plugins.android.application)
}

// 手表端刻意保持零依赖：ColorOS Watch 只有 1GB 内存 / 8GB 存储，
// 不引 AppCompat、Material、Gson，连 androidx 都不碰，APK 目标 150KB 以内。

// 和手机端共用同一张 release 证书；没配置时退回 debug 证书，保证侧载可用。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseStoreFile = localProps.getProperty('release.storeFile')
def hasReleaseSigning = releaseStoreFile && localProps.getProperty('release.storePassword')
        && localProps.getProperty('release.keyAlias')
        && localProps.getProperty('release.keyPassword')

android {
    namespace 'com.netessx.qutschedule.wear'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.netessx.qutschedule.wear"
        // OPPO Watch 2 是 Android 8.1；targetSdk 也压在这一档，
        // 免掉后台限制、通知渠道这些新版本才有的约束
        minSdk 27
        targetSdk 27
        versionCode 1
        versionName "v1.0.0"
    }

    signingConfigs {
        // 优先用项目共用证书（和手机端一致，换机器也能覆盖安装）；
        // 没配置时退回本机 debug 证书，保证侧载可用
        sideload {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword localProps.getProperty('release.storePassword')
                keyAlias localProps.getProperty('release.keyAlias')
                keyPassword localProps.getProperty('release.keyPassword')
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.sideload
        }
    }

    lint {
        // 手表端只侧载、不上架 Play，targetSdk 故意压在 27 以适配 ColorOS Watch 3
        disable 'ExpiredTargetSdkVersion'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 不声明任何依赖：全部用系统自带的控件与 org.json
